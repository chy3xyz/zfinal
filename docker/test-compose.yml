version: "3.9"

# Live database test environment for PG + MySQL drivers.
#
# Usage:
#   cd docker
#   docker compose -f test-compose.yml up -d
#   # wait ~5s for DBs to be ready (healthcheck below)
#   ./run-live-tests.sh
#   docker compose -f test-compose.yml down -v
#
# The integration tests in src/db/integration_test.zig detect PG/MySQL
# via the DSN env vars ZFINAL_TEST_PG_DSN / ZFINAL_TEST_MYSQL_DSN and
# run real queries (CRUD, transaction, binary wire-format decode,
# incremental iterator). When those env vars are unset, the tests
# skip themselves — no live DB required for normal CI.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zfinal_test
      POSTGRES_USER: zfinal
      POSTGRES_PASSWORD: zfinal_test_pw
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zfinal -d zfinal_test"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: zfinal_test
      MYSQL_USER: zfinal
      MYSQL_PASSWORD: zfinal_test_pw
      MYSQL_ROOT_PASSWORD: root_pw
    command: --default-authentication-plugin=caching_sha2_password
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uzfinal", "-pzfinal_test_pw"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 15s
