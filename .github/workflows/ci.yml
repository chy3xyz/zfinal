name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Must match minimum_zig_version in build.zig.zon.
        zig-version: ['0.17.0-dev.1422+e863bf3be']

    steps:
    - uses: actions/checkout@v4

    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        version: ${{ matrix.zig-version }}

    - name: Install SQLite (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y sqlite3 libsqlite3-dev

    - name: Install SQLite (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install sqlite3

    - name: Build
      run: zig build

    - name: Run tests
      run: zig build test

    - name: Run codegen regression tests
      run: zig build test-zf

    - name: Release-mode smoke build
      run: zig build -Doptimize=ReleaseSafe

    - name: Build CLI tool
      run: zig build install

    - name: Test CLI
      run: |
        export PATH="$PATH:$(pwd)/zig-out/bin"
        zf version
        zf help

  drivers-compile:
    name: Compile with PG + MySQL + zent
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        version: '0.17.0-dev.1422+e863bf3be'
    - name: Install client libs
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev libpq-dev default-libmysqlclient-dev
    - name: Build with optional drivers
      run: zig build -Ddriver_pg=true -Ddriver_mysql=true -Denable-zent=true
    - name: Unit tests with optional drivers
      run: zig build test -Ddriver_pg=true -Ddriver_mysql=true -Denable-zent=true
    - name: Codegen regression
      run: zig build test-zf

  drivers-live:
    name: Live PG + MySQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: zfinal
          POSTGRES_USER: postgres
          POSTGRES_DB: zfinal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: zfinal
          MYSQL_DATABASE: zfinal_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pzfinal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
    - uses: actions/checkout@v4
    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        version: '0.17.0-dev.1422+e863bf3be'
    - name: Install client libs
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev libpq-dev default-libmysqlclient-dev
    - name: Live driver tests
      env:
        ZF_PG_HOST: 127.0.0.1
        ZF_PG_PORT: 5432
        ZF_PG_USER: postgres
        ZF_PG_PASSWORD: zfinal
        ZF_PG_DATABASE: zfinal_test
        ZF_MY_HOST: 127.0.0.1
        ZF_MY_PORT: 3306
        ZF_MY_USER: root
        ZF_MY_PASSWORD: zfinal
        ZF_MY_DATABASE: zfinal_test
      run: zig build test -Ddriver_pg=true -Ddriver_mysql=true

  production-example:
    name: Production example build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        version: '0.17.0-dev.1422+e863bf3be'
    - name: Install SQLite
      run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
    - name: Build and install (includes production binary)
      run: zig build -Doptimize=ReleaseSafe
    - name: Assert production example binary
      run: test -x zig-out/bin/production

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        version: '0.17.0-dev.1422+e863bf3be'

    - name: Check formatting
      run: zig fmt --check src/ tools/ examples/ benchmark/ build.zig

    - name: Build CLI tool
      run: zig build install

    - name: Production contract scan
      run: |
        export PATH="$PATH:$(pwd)/zig-out/bin"
        zf check --prod
