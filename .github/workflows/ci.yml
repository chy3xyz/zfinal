name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Productized gate (scripts/quality_gate.sh full) is the Ubuntu merge gatekeeper.
# macOS + optional drivers remain for coverage; do not re-run the full gate there.
# The Zig toolchain is single-sourced from repo-root `.zig-version` (also read by
# docker/Dockerfile and verified by scripts/quality_gate.sh).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality gate (productized)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Read pinned Zig version
      id: zigver
      run: echo "version=$(cat .zig-version)" >> "$GITHUB_OUTPUT"
    - name: Setup Zig
      uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
      with:
        version: ${{ steps.zigver.outputs.version }}
    - name: Install SQLite
      run: |
        sudo apt-get update
        sudo apt-get install -y sqlite3 libsqlite3-dev
    - name: Full quality gate
      run: bash scripts/quality_gate.sh full

  test-macos:
    name: Test on macOS
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Read pinned Zig version
      id: zigver
      run: echo "version=$(cat .zig-version)" >> "$GITHUB_OUTPUT"
    - name: Setup Zig
      uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
      with:
        version: ${{ steps.zigver.outputs.version }}
    - name: Install SQLite
      run: brew install sqlite3
    - name: Build + unit + codegen
      run: |
        zig build
        zig build test
        zig build test-zf
        zig build test-zfsaas

  drivers-compile:
    name: Compile with PG + MySQL + zent
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Read pinned Zig version
      id: zigver
      run: echo "version=$(cat .zig-version)" >> "$GITHUB_OUTPUT"
    - name: Setup Zig
      uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
      with:
        version: ${{ steps.zigver.outputs.version }}
    - name: Install client libs
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev libpq-dev default-libmysqlclient-dev
    - name: Build with optional drivers
      run: zig build -Ddriver_pg=true -Ddriver_mysql=true -Denable-zent=true
    - name: Unit tests with optional drivers
      run: zig build test -Ddriver_pg=true -Ddriver_mysql=true -Denable-zent=true
    - name: Codegen regression
      run: zig build test-zf

  drivers-live:
    name: Live PG + MySQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: zfinal
          POSTGRES_USER: postgres
          POSTGRES_DB: zfinal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: zfinal
          MYSQL_DATABASE: zfinal_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pzfinal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Read pinned Zig version
      id: zigver
      run: echo "version=$(cat .zig-version)" >> "$GITHUB_OUTPUT"
    - name: Setup Zig
      uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
      with:
        version: ${{ steps.zigver.outputs.version }}
    - name: Install client libs
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev libpq-dev default-libmysqlclient-dev
    - name: Live driver tests
      env:
        ZF_PG_HOST: 127.0.0.1
        ZF_PG_PORT: 5432
        ZF_PG_USER: postgres
        ZF_PG_PASSWORD: zfinal
        ZF_PG_DATABASE: zfinal_test
        ZF_MY_HOST: 127.0.0.1
        ZF_MY_PORT: 3306
        ZF_MY_USER: root
        ZF_MY_PASSWORD: zfinal
        ZF_MY_DATABASE: zfinal_test
      run: zig build test -Ddriver_pg=true -Ddriver_mysql=true

  messaging-live:
    name: Live NATS + Kafka consume soak
    runs-on: ubuntu-latest
    services:
      nats:
        image: nats:2.10
        ports:
          - 4222:4222
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Read pinned Zig version
      id: zigver
      run: echo "version=$(cat .zig-version)" >> "$GITHUB_OUTPUT"
    - name: Setup Zig
      uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
      with:
        version: ${{ steps.zigver.outputs.version }}
    - name: Install SQLite
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev
    - name: Start Redpanda (Kafka-compatible)
      run: |
        set -euo pipefail
        docker run -d --name zf-redpanda -p 9092:9092 \
          docker.redpanda.com/redpandadata/redpanda:v24.2.4 \
          redpanda start --mode dev-container --smp 1 --memory 512M \
            --overprovisioned --check=false \
            --kafka-addr 0.0.0.0:9092 \
            --advertise-kafka-addr 127.0.0.1:9092
        echo "waiting for :9092 ..."
        for i in $(seq 1 60); do
          if (echo > /dev/tcp/127.0.0.1/9092) >/dev/null 2>&1; then
            echo "tcp 9092 open after ${i}s"
            break
          fi
          sleep 1
        done
        (echo > /dev/tcp/127.0.0.1/9092) >/dev/null 2>&1 || {
          echo "Redpanda port 9092 never opened"; docker logs zf-redpanda | tail -80; exit 1
        }
        # Best-effort cluster health + pre-create soak topics
        for i in $(seq 1 30); do
          if docker exec zf-redpanda rpk cluster health 2>/dev/null | grep -qi healthy; then
            echo "redpanda healthy"
            break
          fi
          sleep 2
        done
        docker exec zf-redpanda rpk topic create zfinal.robustmq.smoke \
          zfinal.robustmq.consume.soak -p 1 -r 1 || true
    - name: Messaging live soak
      env:
        NATS_URL: nats://127.0.0.1:4222
        KAFKA_BOOTSTRAP: 127.0.0.1:9092
        ROBUSTMQ_URL: 127.0.0.1:9092
      run: zig build test

  # Safety-checked optimized build: catches UB / optimization-sensitive
  # behaviour that the Debug suite cannot. Debug-only helpers (e.g.
  # ParamQuery.toSql) are compiled out of their tests in this mode.
  test-releasesafe:
    name: Unit tests (ReleaseSafe)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Read pinned Zig version
      id: zigver
      run: echo "version=$(cat .zig-version)" >> "$GITHUB_OUTPUT"
    - name: Setup Zig
      uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
      with:
        version: ${{ steps.zigver.outputs.version }}
    - name: Install SQLite
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev
    - name: Unit tests (ReleaseSafe)
      run: zig build test -Doptimize=ReleaseSafe

  # Non-blocking early warning for upstream Zig dev breakage. The supported
  # toolchain is pinned in `.zig-version`; this job only tells us *before* an
  # upgrade is attempted which std APIs moved.
  zig-latest-canary:
    name: Zig latest-dev canary (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup Zig (master)
      uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
      with:
        version: master
    - name: Install SQLite
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev
    - name: Build (expected to break on master drift)
      run: |
        echo "canary toolchain: $(zig version)"
        zig build
