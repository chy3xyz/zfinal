name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        version: '0.17.0-dev.1422+e863bf3be'

    - name: Install SQLite
      run: |
        sudo apt-get update
        sudo apt-get install -y sqlite3 libsqlite3-dev

    - name: Release quality gate
      run: bash scripts/quality_gate.sh release --strict

    - name: Build zf (ReleaseSafe)
      run: zig build install-zf -Doptimize=ReleaseSafe

    - name: Upload zf binary
      uses: actions/upload-artifact@v4
      with:
        name: zf-linux-x86_64
        path: zig-out/bin/zf

  release-macos:
    name: Build zf (macOS)
    needs: release-gate
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        version: '0.17.0-dev.1422+e863bf3be'

    - name: Install SQLite
      run: brew install sqlite3 || true

    - name: Build zf
      run: zig build install-zf -Doptimize=ReleaseSafe

    - name: Upload zf binary
      uses: actions/upload-artifact@v4
      with:
        name: zf-macos-aarch64
        path: zig-out/bin/zf
