   responses:
    '200':
     description: OK
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/JsonOk'
    '400':
     description: Bad Request
     content:
      application/json:
       schema:
        $ref: '#/components/schemas/HttpError'
    '401':
