# Reference reverse proxy in front of examples/production (ZFinal on :8080).
# Pattern: client keep-alive at nginx; upstream stays short-lived (ZFinal
# force_connection_close=true). See doc/reverse_proxy.md.

upstream zfinal_app {
    server 127.0.0.1:8080;
    keepalive 0;   # do not pool upstream connections to ZFinal
}

server {
    listen 443 ssl http2;
    server_name api.example.com;

    # ssl_certificate     /etc/ssl/certs/api.example.com.pem;
    # ssl_certificate_key /etc/ssl/private/api.example.com.key;

    client_max_body_size 1m;

    # Client-facing timeouts (keep-alive lives here)
    keepalive_timeout 65s;
    keepalive_requests 1000;

    location / {
        proxy_pass http://zfinal_app;
        proxy_http_version 1.1;

        # ZFinal forces Connection: close; do not advertise upstream keep-alive
        proxy_set_header Connection close;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Slightly above ZFinal read/write/request timeouts (30s)
        proxy_connect_timeout 5s;
        proxy_send_timeout    35s;
        proxy_read_timeout    35s;
    }

    location = /health {
        proxy_pass http://zfinal_app;
        proxy_http_version 1.1;
        proxy_set_header Connection close;
        proxy_connect_timeout 2s;
        proxy_read_timeout    5s;
        access_log off;
    }
}

# Optional local HTTP → app (dev only)
server {
    listen 8081;
    server_name localhost;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection close;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
